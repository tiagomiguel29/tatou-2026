name: Security Tests

on:
  push:
    branches:
      - main
      - niloy-samm-security-testing
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server and development dependencies
        run: python -m pip install -e "server[dev]"

      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit server

      - name: Run security tests with coverage
        run: pytest server/test/ -v

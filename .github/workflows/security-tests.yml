name: Security Tests

on:
  push:
    branches:
      - main
      - niloy-samm-security-testing
      - niloy-phase2
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GnuPG for RMAP tests
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Install server and development dependencies
        run: python -m pip install -e "server[dev]"

      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit

      - name: Run security tests with coverage
        if: ${{ !cancelled() }}
        run: PYTHONPATH=server/src pytest server/test/ -v --cov=server/src --cov-report=term-missing
